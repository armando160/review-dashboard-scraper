name: Pipeline Watchdog

on:
  schedule:
    - cron: "0 8 * * *"    # 3 AM EST
    - cron: "0 14 * * *"   # 9 AM EST
    - cron: "0 20 * * *"   # 3 PM EST
  workflow_dispatch: {}

jobs:
  watchdog:
    name: Check scraper ran recently
    runs-on: ubuntu-latest
    steps:
      - name: Check last successful run
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST_RUN=$(gh api "repos/armando160/review-dashboard-scraper/actions/workflows/scrape.yml/runs?status=success&per_page=1" --jq ".workflow_runs[0].updated_at")
          if [ -z "$LAST_RUN" ] || [ "$LAST_RUN" = "null" ]; then
            echo "overdue=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          LAST_EPOCH=$(date -d "$LAST_RUN" +%s)
          NOW_EPOCH=$(date +%s)
          HOURS=$(( (NOW_EPOCH - LAST_EPOCH) / 3600 ))
          echo "Last run: $LAST_RUN (${HOURS}h ago)"
          echo "hours=$HOURS" >> $GITHUB_OUTPUT
          echo "last_run=$LAST_RUN" >> $GITHUB_OUTPUT
          if [ "$HOURS" -ge 10 ]; then
            echo "overdue=true" >> $GITHUB_OUTPUT
            echo "Pipeline is OVERDUE by ${HOURS}h - will send alert"
          else
            echo "overdue=false" >> $GITHUB_OUTPUT
            echo "OK - last run was ${HOURS}h ago"
          fi

      - name: Send alert email
        if: steps.check.outputs.overdue == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.NOTIFY_EMAIL }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "Chai Vision: Scraper overdue (${{ steps.check.outputs.hours }}h since last run)"
          to: armando@chaivision.com
          from: ${{ secrets.NOTIFY_EMAIL }}
          body: |
            The review scraper pipeline has not run in ${{ steps.check.outputs.hours }} hours.

            Last successful run: ${{ steps.check.outputs.last_run }}

            Scheduled runs fire at 12 AM, 6 AM, 12 PM, and 6 PM Eastern.
            One or more runs appear to have been skipped by GitHub Actions.

            To trigger manually:
            https://github.com/armando160/review-dashboard-scraper/actions

            - Chai Vision Watchdog
